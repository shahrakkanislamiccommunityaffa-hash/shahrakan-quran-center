<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول - تعليم القرآن</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card login-box">
  <div style="text-align:center;margin-bottom:16px;">
    <img src="logo.png" alt="شعار المركز" style="width:90px;height:90px;object-fit:contain;">
  </div>
  <h2>🔐 تسجيل الدخول</h2>
  <div id="err" class="error" style="display:none;"></div>
  <label>اسم المستخدم</label>
  <input id="username" autocomplete="username">
  <label>كلمة المرور</label>
  <input id="password" type="password" autocomplete="current-password">
  <button onclick="login()">دخول</button>
</div>
<script>
async function login(){
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('err');
  err.style.display='none';
  try{
    const res = await fetch('/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if(!res.ok){ err.textContent = data.error || 'خطأ بتسجيل الدخول'; err.style.display='block'; return; }
    location.href = '/home.html';
  }catch(e){ err.textContent = 'تعذر الاتصال بالسيرفر'; err.style.display='block'; }
}
document.getElementById('password').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
</script>
</body>
</html>
