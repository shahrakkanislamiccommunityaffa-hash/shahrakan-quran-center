<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حضور المعلمين</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
<style>
.t-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);}
.t-row:last-child{border-bottom:none;}
.t-name{flex:1;font-weight:bold;font-size:15px;}
.t-btn{min-width:110px;background:transparent;border:1px solid var(--border);color:var(--text);}
.t-btn:hover{background:transparent;border-color:var(--accent);}
.t-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.t-btn.on:hover{background:var(--accent-dark);}
.t-btn{min-width:80px;}
.t-btn.off{background:var(--danger);border-color:var(--danger);color:#fff;}
.t-btn.off:hover{background:var(--danger);}
</style>
</head>
<body>
<header class="sub">
  👨‍🏫 حضور المعلمين
  <a href="home.html" style="color:#fff;text-decoration:none;">➡ الرئيسية</a>
</header>
<main>

<div class="card">
  <h2>تسجيل الحضور</h2>
  <div class="row">
    <div>
      <label>التاريخ</label>
      <input id="tDate" type="date">
    </div>
  </div>
  <p class="hint">اضغط «حاضر» أو «غائب» جنب اسم المعلم، واضغط نفس الزر مرة ثانية لإلغاء التسجيل.</p>
  <div id="teachersAttendance"></div>
</div>

<div class="card">
  <h2>إدارة قائمة المعلمين</h2>
  <div class="row">
    <input id="newTeacher" placeholder="اسم المعلم الجديد">
    <input id="newTeacherPhone" placeholder="رقم الواتساب (مثال: 97333xxxxxx)">
    <button onclick="addTeacher()">➕ إضافة</button>
  </div>
  <p class="hint">رقم المعلم يُستخدم فقط لصفحة "التواصل مع المعلمين المتغيبين".</p>
  <div id="teachersManage" style="margin-top:10px;"></div>
</div>

<div class="card">
  <h2>سجل الحضور</h2>
  <div class="row">
    <div>
      <label>عرض يوم محدد</label>
      <input id="filterDate" type="date">
    </div>
    <div style="display:flex;align-items:flex-end;">
      <button class="secondary" onclick="clearFilter()">عرض الكل</button>
    </div>
  </div>
  <div id="list"></div>
</div>

</main>
<script>
async function api(path, opts={}){
  const res = await fetch(path, { headers:{'Content-Type':'application/json'}, ...opts });
  if(res.status===401){ location.href='/login.html'; throw new Error('unauth'); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'خطأ');
  return data;
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

let teachers = [];
let dayRecords = []; // سجلات التاريخ المختار

document.getElementById('tDate').value = todayStr();

async function loadTeachers(){
  teachers = await api('/api/teachers');
  renderManage();
  await loadDay();
}

async function loadDay(){
  const date = document.getElementById('tDate').value;
  dayRecords = date ? await api('/api/teacher-attendance?date='+date) : [];
  renderAttendance();
}

function renderAttendance(){
  const el = document.getElementById('teachersAttendance');
  if(!teachers.length){ el.innerHTML = '<p class="hint">ما فيه معلمين مضافين بعد — أضفهم من "إدارة قائمة المعلمين" تحت.</p>'; return; }
  el.innerHTML = teachers.map(t=>{
    const rec = dayRecords.find(r=>r.teacherName===t.name);
    return `<div class="t-row">
      <span class="t-name">${esc(t.name)}</span>
      <button class="t-btn ${rec&&rec.status!=='غائب'?'on':''}" onclick="setStatus('${t._id}','حاضر')">${rec&&rec.status!=='غائب'?'✅ حاضر':'حاضر'}</button>
      <button class="t-btn ${rec&&rec.status==='غائب'?'off':''}" onclick="setStatus('${t._id}','غائب')">${rec&&rec.status==='غائب'?'❌ غائب':'غائب'}</button>
    </div>`;
  }).join('');
}

async function setStatus(teacherId, status){
  const t = teachers.find(x=>x._id===teacherId);
  const date = document.getElementById('tDate').value;
  if(!t || !date) return alert('اختر التاريخ');
  const rec = dayRecords.find(r=>r.teacherName===t.name);
  const cur = rec ? (rec.status==='غائب' ? 'غائب' : 'حاضر') : null;
  if(cur===status) await api('/api/teacher-attendance/'+rec._id, {method:'DELETE'}); // ضغطة ثانية = إلغاء
  else await api('/api/teacher-attendance', {method:'POST', body: JSON.stringify({teacherName: t.name, date, status})});
  await loadDay();
  await loadList();
}

let editingTeacherId = null;

function renderManage(){
  const el = document.getElementById('teachersManage');
  if(!teachers.length){ el.innerHTML = '<p class="hint">ما فيه معلمين مضافين بعد.</p>'; return; }
  el.innerHTML = teachers.map(t=>{
    if(editingTeacherId===t._id){
      return `<div class="item" style="flex-wrap:wrap;gap:8px;">
        <input id="editTName" value="${esc(t.name)}" style="flex:2;min-width:140px;margin:0;">
        <input id="editTPhone" value="${esc(t.phone||'')}" placeholder="رقم الواتساب" style="flex:2;min-width:140px;margin:0;direction:ltr;text-align:right;">
        <button onclick="saveTeacher('${t._id}')">💾 حفظ</button>
        <button class="secondary" onclick="cancelEditTeacher()">إلغاء</button>
      </div>`;
    }
    return `<div class="item">
      <span><strong>${esc(t.name)}</strong> ${t.phone ? `<span class="hint" style="direction:ltr;unicode-bidi:embed;">— ${esc(t.phone)}</span>` : '<span class="hint">— ⚠ بدون رقم</span>'}</span>
      <span>
        <button class="secondary" onclick="editTeacher('${t._id}')">✏️ تعديل</button>
        <button class="danger" onclick="removeTeacher('${t._id}')">حذف</button>
      </span>
    </div>`;
  }).join('');
}

function editTeacher(id){ editingTeacherId = id; renderManage(); }
function cancelEditTeacher(){ editingTeacherId = null; renderManage(); }
async function saveTeacher(id){
  const name = document.getElementById('editTName').value.trim();
  const phone = document.getElementById('editTPhone').value.trim();
  if(!name) return alert('اكتب اسم المعلم');
  try{
    await api('/api/teachers/'+id, {method:'PUT', body: JSON.stringify({name, phone})});
    editingTeacherId = null;
    await loadTeachers();
    await loadList();
  }catch(e){ alert(e.message); }
}

async function addTeacher(){
  const input = document.getElementById('newTeacher');
  const phoneInput = document.getElementById('newTeacherPhone');
  const name = input.value.trim();
  const phone = phoneInput.value.trim();
  if(!name) return alert('اكتب اسم المعلم');
  try{
    await api('/api/teachers', {method:'POST', body: JSON.stringify({name, phone})});
    input.value = ''; phoneInput.value = '';
    await loadTeachers();
  }catch(e){ alert(e.message); }
}
document.getElementById('newTeacher').addEventListener('keydown', e=>{ if(e.key==='Enter') addTeacher(); });
document.getElementById('newTeacherPhone').addEventListener('keydown', e=>{ if(e.key==='Enter') addTeacher(); });

async function removeTeacher(id){
  const t = teachers.find(x=>x._id===id);
  if(!confirm('حذف "'+(t?t.name:'')+'" من القائمة؟ (سجلات حضوره السابقة تبقى محفوظة)')) return;
  await api('/api/teachers/'+id, {method:'DELETE'});
  await loadTeachers();
}

async function removeRecord(id){
  if(!confirm('حذف هذا السجل؟')) return;
  await api('/api/teacher-attendance/'+id, {method:'DELETE'});
  await loadDay();
  await loadList();
}

async function loadList(){
  const filterDate = document.getElementById('filterDate').value;
  const q = filterDate ? ('?date='+filterDate) : '';
  const records = await api('/api/teacher-attendance'+q);
  const el = document.getElementById('list');
  if(!records.length){ el.innerHTML = '<p class="hint">ما فيه سجلات.</p>'; return; }
  el.innerHTML = records.map(r=>`
    <div class="item">
      <span><strong>${esc(r.teacherName)}</strong> — ${esc(r.date)} — ${r.status==='غائب'?'❌ غائب':'✅ حاضر'}</span>
      <button class="danger" onclick="removeRecord('${r._id}')">حذف</button>
    </div>`).join('');
}

function clearFilter(){ document.getElementById('filterDate').value=''; loadList(); }

document.getElementById('tDate').addEventListener('change', loadDay);
document.getElementById('filterDate').addEventListener('change', loadList);

(async function init(){
  try{ await api('/api/me'); }catch(e){ return; }
  await loadTeachers();
  await loadList();
})();
</script>
</body>
</html>
