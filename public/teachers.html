<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حضور المعلمين</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  👨‍🏫 حضور المعلمين
  <a href="home.html" style="color:#fff;text-decoration:none;">⬅ الرئيسية</a>
</header>
<main>

<div class="card">
  <h2>تسجيل حضور جديد</h2>
  <div class="row">
    <div>
      <label>اسم المعلم</label>
      <input id="tName" list="namesList" placeholder="اكتب اسم المعلم">
      <datalist id="namesList"></datalist>
    </div>
    <div>
      <label>التاريخ</label>
      <input id="tDate" type="date">
    </div>
  </div>
  <button onclick="addAttendance()">✅ تسجيل حضور</button>
</div>

<div class="card">
  <h2>سجل الحضور</h2>
  <div class="row">
    <div>
      <label>عرض يوم محدد</label>
      <input id="filterDate" type="date">
    </div>
    <div style="display:flex;align-items:flex-end;">
      <button class="secondary" onclick="clearFilter()">عرض الكل</button>
    </div>
  </div>
  <div id="list"></div>
</div>

</main>
<script>
async function api(path, opts={}){
  const res = await fetch(path, { headers:{'Content-Type':'application/json'}, ...opts });
  if(res.status===401){ location.href='/login.html'; throw new Error('unauth'); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'خطأ');
  return data;
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

document.getElementById('tDate').value = todayStr();

async function loadNames(){
  const all = await api('/api/teacher-attendance');
  const names = [...new Set(all.map(r=>r.teacherName))];
  document.getElementById('namesList').innerHTML = names.map(n=>`<option value="${esc(n)}">`).join('');
}

async function addAttendance(){
  const teacherName = document.getElementById('tName').value.trim();
  const date = document.getElementById('tDate').value;
  if(!teacherName || !date) return alert('اكتب الاسم واختر التاريخ');
  await api('/api/teacher-attendance', {method:'POST', body: JSON.stringify({teacherName, date})});
  document.getElementById('tName').value = '';
  await loadNames();
  await loadList();
}

async function removeRecord(id){
  if(!confirm('حذف هذا السجل؟')) return;
  await api('/api/teacher-attendance/'+id, {method:'DELETE'});
  await loadList();
}

async function loadList(){
  const filterDate = document.getElementById('filterDate').value;
  const q = filterDate ? ('?date='+filterDate) : '';
  const records = await api('/api/teacher-attendance'+q);
  const el = document.getElementById('list');
  if(!records.length){ el.innerHTML = '<p class="hint">ما فيه سجلات.</p>'; return; }
  el.innerHTML = records.map(r=>`
    <div class="item">
      <span><strong>${esc(r.teacherName)}</strong> — ${esc(r.date)}</span>
      <button class="danger" onclick="removeRecord('${r._id}')">حذف</button>
    </div>`).join('');
}

document.getElementById('filterDate').addEventListener('change', loadList);

(async function init(){
  try{ await api('/api/me'); }catch(e){ return; }
  await loadNames();
  await loadList();
})();
</script>
</body>
</html>
