<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كشف حضور وغياب المعلمين</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
<style>
main.wide{max-width:1200px;}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
table.rep{border-collapse:collapse;width:100%;font-size:13px;background:var(--card);}
table.rep th,table.rep td{border:1px solid var(--border);padding:6px 8px;text-align:center;white-space:nowrap;}
table.rep th{background:#f0efe9;color:var(--accent-dark);position:sticky;top:0;}
table.rep td.name{text-align:right;font-weight:bold;}
table.rep td.txt{text-align:right;}
table.rep th small{display:block;font-weight:normal;color:var(--muted);font-size:11px;}
.p{color:var(--accent);font-weight:bold;font-size:15px;}
.a{color:var(--danger);font-weight:bold;font-size:15px;}
.n{color:#bbb;}
.days label{display:inline-flex;align-items:center;gap:4px;margin:0 0 0 12px;font-size:13px;color:var(--text);}
.days input{width:auto;margin:0;}
.summary{margin:10px 0;color:var(--muted);font-size:13px;}
.print-title{display:none;text-align:center;margin-bottom:10px;}
@media print{
  @page{size:landscape;margin:10mm;}
  header,.no-print{display:none !important;}
  body{background:#fff;}
  main{padding:0;max-width:none;}
  .card{border:none;padding:0;}
  .table-wrap{overflow:visible;border:none;}
  table.rep{font-size:11px;}
  table.rep th{position:static;background:#eee !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .print-title{display:block;}
}
</style>
</head>
<body>
<header class="sub">
  📋 كشف حضور وغياب المعلمين
  <a href="home.html" style="color:#fff;text-decoration:none;">➡ الرئيسية</a>
</header>
<main class="wide">

<div class="card no-print">
  <h2>خيارات الكشف</h2>
  <div class="row">
    <div><label>من تاريخ</label><input id="fromDate" type="date" value="2026-09-12"></div>
    <div><label>إلى تاريخ</label><input id="toDate" type="date" value="2026-10-05"></div>
    <div><label>عرض</label>
      <select id="statusFilter">
        <option value="">الكل</option>
        <option value="absent">الغايبين فقط</option>
        <option value="present">الحاضرين فقط</option>
      </select>
    </div>
    <div><label>ترتيب الجدول</label>
      <select id="sortBy">
        <option value="alpha">أبجدي (أ ← ي)</option>
        <option value="present">الأكثر حضوراً</option>
        <option value="absent">الأكثر غياباً</option>
      </select>
    </div>
  </div>
  <div class="days" style="margin:6px 0 12px;">
    <span class="hint">أيام الدراسة:</span>
    <label><input type="checkbox" class="dayChk" value="6" checked> السبت</label>
    <label><input type="checkbox" class="dayChk" value="1" checked> الاثنين</label>
    <label><input type="checkbox" class="dayChk" value="3" checked> الأربعاء</label>
    <label><input type="checkbox" class="dayChk" value="0"> الأحد</label>
    <label><input type="checkbox" class="dayChk" value="2"> الثلاثاء</label>
    <label><input type="checkbox" class="dayChk" value="4"> الخميس</label>
    <label><input type="checkbox" class="dayChk" value="5"> الجمعة</label>
  </div>
  <button onclick="loadReport()">🔄 تحديث الكشف</button>
  <button class="secondary" onclick="window.print()">🖨 طباعة</button>
</div>

<div class="card">
  <h3 class="print-title">كشف حضور وغياب المعلمين — تعليم القرآن، مركز شهركان الإسلامي</h3>
  <div class="summary" id="summary"></div>
  <div class="table-wrap"><table class="rep" id="rep"></table></div>
  <p class="hint" style="margin-top:8px;">✔ حاضر &nbsp; ✘ غائب &nbsp; — لم تُسجَّل حالته</p>
</div>

</main>
<script>
async function api(path, opts={}){
  const res = await fetch(path, { headers:{'Content-Type':'application/json'}, ...opts });
  if(res.status===401){ location.href='/login.html'; throw new Error('unauth'); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'خطأ');
  return data;
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const DAY_NAMES = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const p2 = n => String(n).padStart(2,'0');
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }

function sortKey(name){
  return (name||'').trim()
    .replace(/[\u064B-\u065F\u0670]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
}

function buildDates(from, to, days){
  const [fy,fm,fd] = from.split('-').map(Number);
  const [ty,tm,td] = to.split('-').map(Number);
  const out = [];
  for(let d = new Date(fy,fm-1,fd), end = new Date(ty,tm-1,td); d <= end; d.setDate(d.getDate()+1)){
    if(days.includes(d.getDay())){
      out.push({ key: `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`, day: d.getDay(), label: `${d.getDate()}/${d.getMonth()+1}` });
    }
  }
  return out;
}

async function loadReport(){
  const from = document.getElementById('fromDate').value;
  const to = document.getElementById('toDate').value;
  if(!from || !to) return alert('حدد التاريخين');
  const days = [...document.querySelectorAll('.dayChk:checked')].map(c=>Number(c.value));
  if(!days.length) return alert('اختر يوم واحد على الأقل');

  const data = await api(`/api/report/teachers?from=${from}&to=${to}`);
  const dates = buildDates(from, to, days);
  const today = todayStr();

  // الحضور مسجَّل فقط، فالغياب = معلم بلا سجل بيوم سُجّل فيه حضور غيره
  // الحالة المسجلة صراحةً (حاضر/غائب). الأيام القديمة (سجلات بدون حالة): بلا سجل بيوم فيه حضور = غائب
  const recState = {};
  const dayHasData = {}, dayExplicit = {};
  data.records.forEach(r=>{
    recState[r.teacherName+'|'+r.date] = r.status==='غائب' ? 'a' : 'p';
    dayHasData[r.date] = true;
    if(r.status) dayExplicit[r.date] = true;
  });
  const stateOf = (name, d) => {
    const s = recState[name+'|'+d.key];
    if(s) return s;
    if(!dayExplicit[d.key] && dayHasData[d.key] && d.key <= today) return 'a';
    return 'n';
  };

  const sortBy = document.getElementById('sortBy').value;
  const teachers = data.teachers.map(t=>{
    let pc=0, ac=0;
    dates.forEach(d=>{ const st = stateOf(t.name,d); if(st==='p') pc++; else if(st==='a') ac++; });
    return { t, pc, ac };
  });
  const sf = document.getElementById('statusFilter').value;
  for(let i=teachers.length-1;i>=0;i--){ const x=teachers[i]; if((sf==='absent'&&x.ac===0)||(sf==='present'&&x.pc===0)) teachers.splice(i,1); }
  const alpha = (a,b)=>sortKey(a.t.name).localeCompare(sortKey(b.t.name),'ar');
  teachers.sort((a,b)=>{
    if(sortBy==='present' && b.pc!==a.pc) return b.pc-a.pc;
    if(sortBy==='absent' && b.ac!==a.ac) return b.ac-a.ac;
    return alpha(a,b);
  });

  let html = '<thead><tr><th>#</th><th>اسم المعلم</th>';
  dates.forEach(d=>{ html += `<th>${d.label}<small>${DAY_NAMES[d.day]}</small></th>`; });
  html += '<th>حاضر</th><th>غائب</th></tr></thead><tbody>';
  teachers.forEach((x,i)=>{
    let cells='';
    dates.forEach(d=>{
      const st = stateOf(x.t.name, d);
      cells += st==='p' ? '<td class="p">✔</td>' : st==='a' ? '<td class="a">✘</td>' : '<td class="n">—</td>';
    });
    html += `<tr><td>${i+1}</td><td class="name">${esc(x.t.name)}</td>${cells}<td class="p">${x.pc}</td><td class="a">${x.ac}</td></tr>`;
  });
  html += '</tbody>';
  document.getElementById('rep').innerHTML = teachers.length ? html : '<tbody><tr><td style="padding:20px;">ما فيه معلمين مضافين بعد — أضفهم من صفحة "تسجيل حضور المعلمين".</td></tr></tbody>';
  document.getElementById('summary').textContent = `${teachers.length} معلم — ${dates.length} يوم دراسي (من ${from} إلى ${to})`;
}

document.getElementById('sortBy').addEventListener('change', loadReport);
document.getElementById('statusFilter').addEventListener('change', loadReport);

(async function init(){
  try{ await api('/api/me'); }catch(e){ return; }
  await loadReport();
})();
</script>
</body>
</html>
